<!DOCTYPE html>
<html><head><title>Modifier mon profil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container mt-4" style="max-width:600px">
<h3>Corriger mes informations (1 seule fois)</h3>
<p class="text-danger">Attention : Vous ne pourrez modifier qu'une seule fois !</p>
<form method="POST">
<input name="nom" value="{{ etudiant.nom }}" class="form-control mb-2">
<input name="prenom" value="{{ etudiant.prenom }}" class="form-control mb-2">
<input name="post_nom" value="{{ etudiant.post_nom }}" class="form-control mb-2">
<input name="faculte" value="{{ etudiant.faculte }}" class="form-control mb-2">
<input name="filiere" value="{{ etudiant.filiere }}" class="form-control mb-2">
<input name="telephone" value="{{ etudiant.telephone }}" class="form-control mb-2">
<input name="email" value="{{ etudiant.email }}" class="form-control mb-2">
<button class="btn btn-primary w-100">Confirmer la modification</button>
</form>
<a href="/dashboard" class="btn btn-secondary mt-2">Retour</a>
</div></body></html>
