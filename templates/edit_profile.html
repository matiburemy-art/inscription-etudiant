{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow-lg p-4" style="border-left:5px solid #ffc107; border-radius:15px">
    <h4 class="mb-4">✏️ Modifier mon profil</h4>
    <form method="POST">
        <div class="row">
            <div class="col-md-4 mb-3"><label>Nom</label><input type="text" name="nom" class="form-control" value="{{ etudiant.nom }}" required></div>
            <div class="col-md-4 mb-3"><label>Prénom</label><input type="text" name="prenom" class="form-control" value="{{ etudiant.prenom }}" required></div>
            <div class="col-md-4 mb-3"><label>Post-nom</label><input type="text" name="post_nom" class="form-control" value="{{ etudiant.post_nom }}" required></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label>Téléphone</label><input type="text" name="telephone" class="form-control" value="{{ etudiant.telephone }}" required></div>
            <div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control" value="{{ etudiant.email }}" required></div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Pays / Nationalité</label>
                <select name="nationalite" class="form-control" required>
                    <option selected>{{ etudiant.nationalite }}</option>
                    <option>Burundi</option><option>Rwanda</option><option>RDC - Congo</option><option>Tanzanie</option><option>Ouganda</option><option>Kenya</option><option>Cameroun</option><option>Sénégal</option><option>Côte d'Ivoire</option><option>Bénin</option><option>Togo</option><option>Mali</option><option>Guinée</option><option>Burkina Faso</option><option>Niger</option><option>Tchad</option><option>Gabon</option><option>Congo Brazzaville</option><option>Afrique du Sud</option><option>Maroc</option><option>Algérie</option><option>Tunisie</option><option>Egypte</option><option>Ethiopie</option><option>France</option><option>Belgique</option><option>Canada</option><option>USA</option><option>Autre</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Faculté</label>
                <select name="faculte" class="form-control" required>
                    <option selected>{{ etudiant.faculte }}</option>
                    <option>Sciences</option><option>Informatique</option><option>Médecine</option><option>Droit</option><option>Économie</option>
                </select>
            </div>
            <div class="col-md-4 mb-3"><label>Filière</label><input type="text" name="filiere" class="form-control" value="{{ etudiant.filiere }}" required></div>
        </div>
        <button class="btn btn-warning w-100 btn-lg fw-bold mt-3">Enregistrer la modification</button>
    </form>
  </div>
</div>
{% endblock %}
