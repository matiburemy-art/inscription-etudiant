<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe - UGL</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:410px;border-radius:18px;box-shadow:0 15px 40px rgba(13,42,84,0.12);padding:32px 28px;text-align:center}
.logo{width:70px;height:70px;background:#0d2a54;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;font-size:26px}
h2{color:#0d2a54;margin:5px 0 6px;font-size:22px}
.sub{color:#64748b;font-size:13.5px;margin-bottom:20px}
.email-badge{background:#f1f5f9;color:#334155;padding:7px 12px;border-radius:20px;font-size:12.5px;display:inline-block;margin-bottom:18px;font-weight:600}
input{width:100%;padding:14px;border:1.8px solid #e2e8f0;border-radius:11px;font-size:15px;outline:none;margin-bottom:12px;transition:.2s}
input:focus{border-color:#0d2a54}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;margin-top:8px;cursor:pointer;transition:.2s}
button:hover{background:#15803d}
.alert{padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:14px;text-align:left}
.alert-danger{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="card">
  <div class="logo">UGL</div>
  <h2>Nouveau mot de passe</h2>
  <div class="email-badge">{{ email }}</div>
  <p class="sub">Tape ton nouveau mot de passe et confirme-le</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <input type="password" name="new_password" placeholder="Nouveau mot de passe" required minlength="6">
    <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
    <button type="submit">Réinitialiser avec succès</button>
  </form>
</div>
</body>
</html>
