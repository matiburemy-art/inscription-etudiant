<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié - UGL</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:410px;border-radius:18px;box-shadow:0 15px 40px rgba(13,42,84,0.12);padding:32px 28px;text-align:center}
.logo{width:70px;height:70px;background:#0d2a54;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;font-size:26px;letter-spacing:1px}
h2{color:#0d2a54;margin:5px 0 6px;font-size:22px}
.sub{color:#64748b;font-size:14px;margin-bottom:22px;line-height:1.4}
input{width:100%;padding:14px 14px;border:1.8px solid #e2e8f0;border-radius:11px;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#0d2a54;background:#f8fafc}
button{width:100%;padding:14px;background:#0d2a54;color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer;transition:.2s}
button:hover{background:#143a75;transform:translateY(-1px)}
.link{display:inline-block;margin-top:18px;color:#0d2a54;text-decoration:none;font-size:13.5px;font-weight:600}
.alert{padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:14px;text-align:left}
.alert-danger{background:#fee2e2;color:#991b1b}
.alert-success{background:#dcfce7;color:#166534}
.alert-info{background:#e0f2fe;color:#0c4a6e}
</style>
</head>
<body>
<div class="card">
  <div class="logo">UGL</div>
  <h2>Mot de passe oublié ?</h2>
  <p class="sub">Entre le Gmail que tu as utilisé lors de ton inscription à l'UGL</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <input type="email" name="email" placeholder="ex: nom@gmail.com" required>
    <button type="submit">Valider mon Gmail</button>
  </form>
  <a class="link" href="/login">← Retour à la connexion</a>
</div>
</body>
</html>
