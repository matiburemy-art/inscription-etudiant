{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card card-pro card-blue shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold"><i class="bi bi-lock-fill text-primary"></i> Connexion</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-person-badge"></i> Etudiant UGL (ID)</label>
                        <input type="text" name="username" class="form-control form-control-lg"  required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-key"></i> Mot de passe</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-pro btn-lg">Se connecter</button>
                </form>
                <div class="mt-3 text-center">
                    <small><a href="#" class="text-muted">Mot de passe oublié ?</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
