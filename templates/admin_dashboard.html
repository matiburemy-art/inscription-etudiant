<!DOCTYPE html>
<html>
<head>
    <title>Admin - Etudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center">PANEL ADMIN - Tous les étudiants</h2>
    <a href="/logout" class="btn btn-secondary mb-3">Déconnexion</a>
    <table class="table table-bordered table-striped bg-white">
        <tr>
            <th>ID</th><th>Nom</th><th>Prénom</th><th>Faculté</th><th>Filière</th><th>Téléphone</th><th>Actions</th>
        </tr>
        {% for e in etudiants %}
        <tr>
            <td>{{ e.username }}</td>
            <td>{{ e.nom }}</td>
            <td>{{ e.prenom }}</td>
            <td>{{ e.faculte }}</td>
            <td>{{ e.filiere }}</td>
            <td>{{ e.telephone }}</td>
            <td>
                <a href="/admin/edit/{{ e.id }}" class="btn btn-warning btn-sm">Modifier</a>
                <a href="/admin/delete/{{ e.id }}" class="btn btn-danger btn-sm" onclick="return confirm('Supprimer?')">Supprimer</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
